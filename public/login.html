<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Inventario IT</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2E3A49">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="login">
  <div class="login-box">
    <img src="/icons/logo-ct.jpg" alt="CT Ingenieros">
    <h1>CT Ingenieros</h1>
    <p class="sub">Inventario IT</p>
    <form id="f">
      <label for="email">Email o usuario de Windows</label>
      <input id="email" type="text" autocomplete="username" autocapitalize="none" required>
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <div class="actions"><button class="primary" type="submit">Entrar</button></div>
      <p id="err" role="alert"></p>
    </form>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/pages/login.js"></script>
</body>
</html>
